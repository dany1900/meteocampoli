
<!-- SPINNER WEBCAM FOTOGRAFICHE -->
<mat-spinner
  *ngIf="tipo === 'immagine' && imageLoader"
  mode="indeterminate">
</mat-spinner>

<br>

<div class="center">
  <figure>

    <!-- INTESTAZIONE WEBCAM -->
    <div class="webcam-script-header">
      <span class="content-webcam-principal">
        <span class="hidden">WebCam</span>
        {{ luogo }}
        <ng-container *ngIf="altitudine">
          | {{ altitudine }} m.s.l.m.
        </ng-container>
        |
      </span>

      <a
        (click)="redirect()"
        class="mouse-pointer"
        rel="noopener noreferrer">
        <span class="mouse-pointer">{{ urlSite }}</span>
      </a>

      <span
        *ngIf="tipo === 'youtube' || tipo === 'iframe' || tipo === 'hls'"
        class="webcam-live-badge">
        &#9679; LIVE
      </span>

      <span
        *ngIf="tipo === 'windy'"
        class="webcam-timelapse-badge">
        &#9654; TIMELAPSE
      </span>
    </div>

    <!-- WEBCAM FOTOGRAFICA -->
    <ng-container *ngIf="tipo === 'immagine'">
      <a
        (click)="openModal(urlWebcam)"
        data-rel="prettyPhoto"
        [hidden]="imageLoader">

        <img
          [src]="urlWebcam"
          [alt]="'Webcam ' + luogo"
          (load)="imageLoader = false"
          (error)="errorHandler(timeout)"
          width="85%"
          height="100%"
          class="webcam lazyload" />
      </a>
    </ng-container>

    <!-- YOUTUBE -->
    <ng-container *ngIf="tipo === 'youtube'">
      <div
        *ngIf="safeVideoUrl"
        class="webcam-youtube-container">

        <iframe
          class="webcam-youtube-player"
          [src]="safeVideoUrl"
          [title]="'Webcam Live ' + luogo"
          loading="lazy"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
    </ng-container>

    <!-- CAMSTREAMER / METEO2 -->
    <ng-container *ngIf="tipo === 'iframe'">
      <div
        *ngIf="safeVideoUrl"
        class="webcam-youtube-container">

        <!-- Pulsante avvio diretta -->
        <button
          *ngIf="!videoAvviato"
          type="button"
          class="webcam-live-preview"
          (click)="avviaVideo()"
          [attr.aria-label]="'Avvia webcam live ' + luogo">

          <span class="webcam-live-play">&#9654;</span>
          <span class="webcam-live-preview-text">
            Guarda la diretta
          </span>
        </button>

        <!-- Player CamStreamer oppure Meteo2 -->
        <iframe
          *ngIf="videoAvviato"
          class="webcam-youtube-player"
          [src]="safeVideoUrl"
          [title]="'Webcam Live ' + luogo"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>

      </div>
    </ng-container>

    <!-- HLS -->
    <ng-container *ngIf="tipo === 'hls'">
      <div
        *ngIf="!videoError || videoAvviato"
        class="webcam-youtube-container">

        <button
          *ngIf="!videoAvviato"
          type="button"
          class="webcam-live-preview"
          (click)="avviaVideo()"
          [attr.aria-label]="'Avvia webcam live ' + luogo">

          <span class="webcam-live-play">&#9654;</span>
          <span class="webcam-live-preview-text">
            Guarda la diretta
          </span>
        </button>

        <video
          *ngIf="videoAvviato"
          #hlsVideo
          class="webcam-hls-player"
          controls
          playsinline
          preload="none"
          [attr.aria-label]="'Webcam Live ' + luogo">
          Il browser non supporta il video HTML5.
        </video>
      </div>

      <div
        *ngIf="videoError"
        class="webcam-hls-message">

        <div>{{ videoError }}</div>

        <button
          *ngIf="videoAvviato"
          type="button"
          class="webcam-retry-button"
          (click)="riprovaVideo()">
          &#8635; Riprova
        </button>
      </div>
    </ng-container>

    <!-- WINDY -->
    <ng-container *ngIf="tipo === 'windy'">

      <div
        *ngIf="safeWindyHtml"
        class="windy-zoom-panel">

        <div
          class="webcam-youtube-container webcam-windy-container">

          <iframe
            class="webcam-windy-iframe"
            [srcdoc]="safeWindyHtml"
            [title]="'Webcam Timelapse ' + luogo"
            loading="lazy"
            scrolling="no"
            allow="fullscreen; autoplay"
            allowfullscreen>
          </iframe>
        </div>
      </div>

      <div
        *ngIf="windyError"
        class="webcam-hls-message">
        {{ windyError }}
      </div>
    </ng-container>

    <!-- STREAMING NON DISPONIBILE -->
    <div
      *ngIf="(tipo === 'youtube' || tipo === 'iframe') && !safeVideoUrl"
      class="webcam-youtube-error">
      Streaming non disponibile.
    </div>

  </figure>
</div>
