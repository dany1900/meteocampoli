<script>
  (function () {

    function fixGoogleAnchorAd() {

      const ads = document.querySelectorAll(
        'ins.adsbygoogle[data-anchor-status="displayed"]'
      );

      ads.forEach(function (ad) {

        ad.style.setProperty('position', 'fixed', 'important');
        ad.style.setProperty('bottom', '0', 'important');
        ad.style.setProperty('top', 'auto', 'important');

        ad.style.setProperty('left', '0', 'important');
        ad.style.setProperty('right', '0', 'important');

        ad.style.setProperty('width', '100%', 'important');
        ad.style.setProperty('max-width', 'none', 'important');

        ad.style.setProperty('margin', '0', 'important');
        ad.style.setProperty('padding', '0', 'important');

        ad.style.setProperty('transform', 'none', 'important');
        ad.style.setProperty('display', 'block', 'important');

        ad.style.setProperty('background', '#fff', 'important');
        ad.style.setProperty('border-radius', '0', 'important');
        ad.style.setProperty('box-sizing', 'border-box', 'important');


        const host = ad.querySelector('[id$="_host"]');

        if (host) {

          host.style.setProperty('position', 'absolute', 'important');

          host.style.setProperty('left', '50%', 'important');
          host.style.setProperty('right', 'auto', 'important');

          host.style.setProperty(
            'transform',
            'translateX(-50%)',
            'important'
          );

          host.style.setProperty('margin', '0', 'important');
        }


        const grip = ad.querySelector('.grippy-host');

        if (grip) {

          grip.style.setProperty('position', 'absolute', 'important');

          grip.style.setProperty('left', '50%', 'important');
          grip.style.setProperty('right', 'auto', 'important');

          grip.style.setProperty(
            'transform',
            'translateX(-50%)',
            'important'
          );
        }

      });

    }


    window.addEventListener('load', function () {

      fixGoogleAnchorAd();

      setTimeout(fixGoogleAnchorAd, 1000);
      setTimeout(fixGoogleAnchorAd, 3000);

    });


    const observer = new MutationObserver(function () {
      fixGoogleAnchorAd();
    });

    observer.observe(document.documentElement, {
      childList: true,
      subtree: true,
      attributes: true
    });

  })();
</script>
